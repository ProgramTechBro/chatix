name: chatix
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  injectable: ^2.4.4
  get_it: ^7.7.0
  go_router: ^14.2.0
  dartz: ^0.10.1
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  supabase_flutter: ^2.5.6
  firebase_core: ^3.3.0
  firebase_auth: ^5.1.4
  firebase_messaging: ^15.1.0
  awesome_notifications: ^0.12.1
  flutter_dotenv: ^5.1.0

  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.2.2
  cached_network_image: ^3.4.0

  image_picker: ^1.1.2
  permission_handler: ^11.3.1
  device_info_plus: ^12.4.0
  path_provider: ^2.1.6

  record: ^7.1.1
  waveform_flutter: ^1.2.0
  audio_waveforms: ^2.0.2
  flutter_cache_manager: ^3.4.2

  intl: ^0.20.0
  flutter_intl_phone_field: ^0.0.7
  flutter_svg: ^2.3.0
  video_player: ^2.13.0
  visibility_detector: ^0.4.0+2
  bot_toast: ^4.1.3
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  skeletonizer: ^2.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  build_runner: ^2.4.11
  riverpod_generator: ^2.4.0
  injectable_generator: ^2.6.1
  freezed: ^2.5.7
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - .env

  fonts:
    - family: Urbanist
      fonts:
        - asset: assets/fonts/Urbanist-Regular.ttf
          weight: 400
        - asset: assets/fonts/Urbanist-Medium.ttf
          weight: 500
        - asset: assets/fonts/Urbanist-SemiBold.ttf
          weight: 600
    - family: RobotoFlex
      fonts:
        - asset: assets/fonts/RobotoFlex-Medium.ttf
          weight: 500
